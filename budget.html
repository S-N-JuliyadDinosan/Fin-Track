<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FinTrack - Budget</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      (function () {
        const theme = localStorage.getItem("fintrack_theme");
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />

    <script id="tailwind-config">

              "inverse-on-surface": "#f0f0fb",
              "on-tertiary": "#ffffff",
              surface: "#faf8ff",
              "outline-variant": "#c3c6d7",

              "on-tertiary-container": "#ffecea",

              "on-tertiary-fixed": "#410004",

              "surface-bright": "#faf8ff",

              "on-primary-container": "#eeefff",
              "on-primary-fixed-variant": "#003ea8",
              "primary-container": "#2563eb",
              "on-primary": "#ffffff",
              "on-secondary-fixed-variant": "#005321",
              "tertiary-container": "#cf2c30",
              tertiary: "#ab0b1c",
              "secondary-fixed": "#6bff8f",
              "on-background": "#191b23",

              "inverse-surface": "#2e3039",

            fontSize: {
              h2: ["20px", { lineHeight: "1.4", fontWeight: "600" }],
              "label-sm": ["12px", { lineHeight: "1.2", fontWeight: "600" }],
              "label-md": [
                "14px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "0.01em",
                  fontWeight: "500",
                },
              ],
              "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              display: [
                "36px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              h1: ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
            },
          },
        },
      };
    </script>

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        vertical-align: middle;
      }
      .elevation-1 {
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased">
    <!-- SideNavBar -->
    <aside
      class="fixed left-0 top-0 flex flex-col h-full z-50 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700 h-screen w-64 font-manrope antialiased transition-all duration-200 ease-in-out"
    >
      <div class="p-6 flex items-center gap-3">
        <div
          class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white"
        >
          <span class="material-symbols-outlined">payments</span>
        </div>
        <div>
          <h1 class="text-xl font-black text-slate-900 dark:text-white">
            FinTrack
          </h1>
          <p
            class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider font-bold"
          >
            Personal Wealth
          </p>
        </div>
      </div>

      <nav class="flex-1 mt-6 px-4 space-y-2">
        <a
          class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800"
          href="index.html"
        >
          <span class="material-symbols-outlined">dashboard</span>
          <span class="font-label-md">Dashboard</span>
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800"
          href="transactions.html"
        >
          <span class="material-symbols-outlined">receipt_long</span>
          <span class="font-label-md">Transactions</span>
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800"
          href="analytics.html"
        >
          <span class="material-symbols-outlined">analytics</span>
          <span class="font-label-md">Analytics</span>
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 bg-blue-50 dark:bg-blue-950 text-blue-600 font-semibold border-r-4 border-blue-600"
          href="budget.html"
        >
          <span class="material-symbols-outlined">account_balance_wallet</span>
          <span class="font-label-md">Budget</span>
        </a>
        <a
          class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800"
          href="settings.html"
        >
          <span class="material-symbols-outlined">settings</span>
          <span class="font-label-md">Settings</span>
        </a>
      </nav>

      <div class="p-4 mt-auto border-t border-slate-100 dark:border-slate-700">
        <div
          class="flex items-center gap-3 p-2 bg-surface-container-low dark:bg-slate-800 rounded-xl"
        >
          <img
            alt="User Profile"
            class="w-10 h-10 rounded-full border-2 border-white shadow-sm"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAs77p-vP8nU90Ps89eS5qj6_aeiRvVgrN7no6dbPxT2_oKdZyyS03XLULtpy_Pp38RV0285HcoBlThPyoO-D2wlwkr4FZD2NC-9BjTz02B-VrpZU9eucKhikLj06U98w7UdTEJ-rzFE3R0t_lKtkRRtGMuBHljONct60UR95-RcAQmI9s6PmaE9FCm9-5GJ3y26cbNUBk9O2XfP_ZzJod50elOps-O4lcAqJpW7NaObJYUQbz1INLDY8cOg5z-_vi87mKzLsVv73EI"
          />
          <div class="overflow-hidden">
            <p
              class="font-label-md text-on-surface dark:text-white truncate"
              id="display-username"
            >
              Alex Sterling
            </p>
            <p class="text-[10px] text-slate-500 dark:text-slate-400 truncate">
              Premium Member
            </p>
          </div>
        </div>
      </div>
    </aside>

    <!-- TopNavBar -->
    <header
      class="sticky top-0 w-full flex items-center justify-between px-6 z-40 ml-64 bg-white/80 dark:bg-slate-900 backdrop-blur-md h-16 border-b border-slate-200 dark:border-slate-700 shadow-sm"
      style="width: calc(100% - 16rem)"
    >
      <div class="flex items-center gap-4">
        <h2 class="font-h2 text-h2 text-slate-900 dark:text-white">Budget</h2>
      </div>
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-4 text-slate-500">
          <button
            onclick="toggleDarkMode()"
            class="hover:text-blue-600 transition-colors"
          >
            <span class="material-symbols-outlined" id="theme-icon"
              >dark_mode</span
            >
          </button>
          <button
            onclick="logout()"
            class="hover:text-blue-600 transition-colors"
          >
            <span class="material-symbols-outlined">logout</span>
          </button>
        </div>
        <div class="h-8 w-[1px] bg-slate-200 dark:bg-slate-700"></div>
        <p
          id="current-date"
          class="text-sm font-medium text-slate-600 dark:text-slate-400"
        ></p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="ml-64 p-8 min-h-screen bg-surface dark:bg-slate-950">
      <div class="max-w-7xl mx-auto space-y-8">
        <!-- Month & Year Selector -->
        <div class="flex justify-between items-center">
          <h1 class="font-h1 text-h1 text-on-surface dark:text-white">
            Monthly Budget
          </h1>
          <div class="flex gap-3">
            <select
              id="month-select"
              onchange="loadBudgetData()"
              class="bg-white dark:bg-slate-800 border border-slate-200 dark:text-white dark:border-slate-700 rounded-2xl pr-7 py-2 text-sm font-medium focus:ring-2 focus:ring-primary"
            ></select>
            <select
              id="year-select"
              onchange="loadBudgetData()"
              class="bg-white dark:bg-slate-800 border border-slate-200 dark:text-white dark:border-slate-700 rounded-2xl pr-8 py-2 text-sm font-medium focus:ring-2 focus:ring-primary"
            ></select>
          </div>
        </div>

        <!-- Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-white dark:bg-slate-800 p-6 rounded-xl elevation-1">
            <p class="text-sm text-slate-500 dark:text-slate-400">
              Total Budget
            </p>
            <h3
              id="total-budget"
              class="text-4xl font-bold dark:text-white mt-1"
            >
              $0
            </h3>
          </div>
          <div class="bg-white dark:bg-slate-800 p-6 rounded-xl elevation-1">
            <p class="text-sm text-slate-500 dark:text-slate-400">
              Total Spent
            </p>
            <h3 id="total-spent" class="text-4xl font-bold text-tertiary mt-1">
              $0
            </h3>
          </div>
          <div class="bg-white dark:bg-slate-800 p-6 rounded-xl elevation-1">
            <p class="text-sm text-slate-500 dark:text-slate-400">Remaining</p>
            <h3
              id="total-remaining"
              class="text-4xl font-bold text-secondary mt-1"
            >
              $0
            </h3>
          </div>
        </div>

        <!-- Category Breakdown -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl elevation-1">
          <h2 class="font-h2 text-h2 mb-6 dark:text-white">
            Category Breakdown
          </h2>
          <div
            id="category-breakdown"
            class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"
          ></div>
        </div>
      </div>
    </main>

    <script>
      const categories = [
        "Income",
        "Food & Dining",
        "Housing",
        "Transportation",
        "Entertainment",
        "Shopping",
        "Utilities",
        "Healthcare",
        "Education",
        "Travel",
        "Miscellaneous",
      ];

      let currentUser = null;
      let transactions = [];
      let budgets = {};
      let selectedYear = new Date().getFullYear();
      let selectedMonth = new Date().getMonth();

      function getMonthKey(year, month) {
        return `${year}-${String(month + 1).padStart(2, "0")}`;
      }

      function showMainApp() {
        document.getElementById("display-username").textContent = currentUser;
        document.getElementById("current-date").textContent =
          new Date().toLocaleDateString("en-US", {
            year: "numeric",
            month: "short",
            day: "numeric",
          });
        loadData();
        populateSelectors();
        loadBudgetData();
      }

      function loadData() {
        transactions = JSON.parse(
          localStorage.getItem(`transactions_${currentUser}`) || "[]",
        );
        budgets = JSON.parse(
          localStorage.getItem(`budgets_${currentUser}`) || "{}",
        );
      }

      function saveData() {
        localStorage.setItem(`budgets_${currentUser}`, JSON.stringify(budgets));
      }

      function populateSelectors() {
        const monthSelect = document.getElementById("month-select");
        const yearSelect = document.getElementById("year-select");

        const monthNames = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        monthSelect.innerHTML = "";
        for (let i = 0; i < 12; i++) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = monthNames[i];
          if (i === selectedMonth) opt.selected = true;
          monthSelect.appendChild(opt);
        }

        yearSelect.innerHTML = "";
        for (let y = selectedYear - 3; y <= selectedYear + 2; y++) {
          const opt = document.createElement("option");
          opt.value = y;
          opt.textContent = y;
          if (y === selectedYear) opt.selected = true;
          yearSelect.appendChild(opt);
        }
      }

      function loadBudgetData() {
        selectedMonth = parseInt(document.getElementById("month-select").value);
        selectedYear = parseInt(document.getElementById("year-select").value);

        const monthKey = getMonthKey(selectedYear, selectedMonth);
        const currentBudgets = budgets[monthKey] || {};

        const isCurrentOrFuture =
          selectedYear > new Date().getFullYear() ||
          (selectedYear === new Date().getFullYear() &&
            selectedMonth >= new Date().getMonth());

        const filteredTransactions = transactions.filter((t) => {
          const d = new Date(t.date);
          return (
            d.getFullYear() === selectedYear &&
            d.getMonth() === selectedMonth &&
            t.category !== "Income"
          );
        });

        const expenseByCat = {};
        filteredTransactions.forEach((t) => {
          expenseByCat[t.category] = (expenseByCat[t.category] || 0) + t.amount;
        });

        let totalBudget = 0,
          totalSpent = 0;

        const container = document.getElementById("category-breakdown");
        container.innerHTML = "";

        categories.forEach((cat) => {
          if (cat === "Income") return;
          const spent = expenseByCat[cat] || 0;
          const budget = currentBudgets[cat] || 0;
          totalBudget += budget;
          totalSpent += spent;
          const percent =
            budget > 0 ? Math.min(Math.round((spent / budget) * 100), 100) : 0;

          const canEdit = isCurrentOrFuture;

          const div = document.createElement("div");
          div.className =
            "bg-white dark:bg-slate-800 p-6 rounded-2xl elevation-1";
          div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="font-medium dark:text-white">${cat}</p>
              <p class="text-sm text-slate-500 dark:text-slate-400">$${spent.toFixed(0)} / $${budget}</p>
            </div>
            ${canEdit ? `<button onclick="editBudget('${cat}')" class="text-xs px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl">Edit</button>` : ""}
          </div>
          <div class="w-full h-3 bg-slate-100 dark:bg-slate-700 rounded-full mt-4 overflow-hidden">
            <div class="h-full ${percent > 90 ? "bg-red-500" : "bg-primary"}" style="width: ${percent}%"></div>
          </div>
          <p class="text-xs text-right mt-2 ${percent > 90 ? "text-red-500" : "text-slate-500"}">${percent}% used</p>
        `;
          container.appendChild(div);
        });

        document.getElementById("total-budget").textContent =
          "$" + totalBudget.toFixed(0);
        document.getElementById("total-spent").textContent =
          "$" + totalSpent.toFixed(0);
        document.getElementById("total-remaining").textContent =
          "$" + Math.max(0, totalBudget - totalSpent).toFixed(0);
      }

      function editBudget(category) {
        const monthKey = getMonthKey(selectedYear, selectedMonth);
        if (!budgets[monthKey]) budgets[monthKey] = {};

        const current = budgets[monthKey][category] || 0;
        const newVal = prompt(
          `Set monthly budget for ${category} (${monthKey})`,
          current,
        );

        if (newVal !== null) {
          budgets[monthKey][category] = parseFloat(newVal) || 0;
          saveData();
          loadBudgetData();
        }
      }

      function getMonthKey(year, month) {
        return `${year}-${String(month + 1).padStart(2, "0")}`;
      }

      function logout() {
        if (confirm("Are you sure you want to logout?")) {
          localStorage.removeItem("fintrack_current_user");
          location.reload();
        }
      }

      function toggleDarkMode() {
        const html = document.documentElement;
        html.classList.toggle("dark");
        localStorage.setItem(
          "fintrack_theme",
          html.classList.contains("dark") ? "dark" : "light",
        );
        document.getElementById("theme-icon").textContent =
          html.classList.contains("dark") ? "light_mode" : "dark_mode";
      }

      window.onload = function () {
        const savedUser = localStorage.getItem("fintrack_current_user");
        if (savedUser) {
          currentUser = savedUser;
          showMainApp();
        } else {
          window.location.href = "index.html";
        }

        const savedTheme = localStorage.getItem("fintrack_theme");
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
          document.getElementById("theme-icon").textContent = "light_mode";
        }
      };
    </script>
  </body>
</html>
