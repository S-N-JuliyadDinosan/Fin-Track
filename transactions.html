    <script>
      const categories = [
        "Income",
        "Food & Dining",
        "Housing",
        "Transportation",
        "Entertainment",
        "Shopping",
        "Utilities",
        "Healthcare",
        "Education",
        "Travel",
        "Miscellaneous",
      ];
      let currentUser = null;
      let transactions = [];
      let currentPage = 1;
      const rowsPerPage = 10;
      let filteredData = [];
      function showMainApp() {
        document.getElementById("display-username").textContent = currentUser;
        document.getElementById("current-date").textContent =
          new Date().toLocaleDateString("en-US", {
            year: "numeric",
            month: "short",
            day: "numeric",
          });
        loadData();
        populateAllCategories();
        filteredData = [...transactions];
        renderTransactions();
      }
      function loadData() {
        transactions = JSON.parse(
          localStorage.getItem(`transactions_${currentUser}`) || "[]",
        );
      }
      function saveData() {
        localStorage.setItem(
          `transactions_${currentUser}`,
          JSON.stringify(transactions),
        );
      }
      function populateAllCategories() {
        const select = document.getElementById("category-filter");
        select.innerHTML = `<option value="">All Categories</option>`;
        categories.forEach((cat) => {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          select.appendChild(opt);
        });
      }
      function populateModalCategories() {
        const select = document.getElementById("modal-category");
        select.innerHTML = `<option value="">Select Category</option>`;
        categories.forEach((cat) => {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          select.appendChild(opt);
        });
      }
      function renderTransactions() {
        const tbody = document.getElementById("transactions-body");
        tbody.innerHTML = "";
        const start = (currentPage - 1) * rowsPerPage;
        const paginated = filteredData.slice(start, start + rowsPerPage);
        if (paginated.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 dark:text-slate-500">No transactions found</td></tr>`;
          renderPagination();
          return;
        }
        paginated.forEach((tx) => {
          const isIncome = tx.category === "Income";
          const row = document.createElement("tr");
          row.className =
            "hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors";
          row.innerHTML = `
          <td class="px-6 py-5 font-medium dark:text-white">${tx.description}</td>
          <td class="px-6 py-5">
            <span class="px-4 py-1 text-xs rounded-full ${isIncome ? "bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300" : "bg-orange-100 dark:bg-orange-900 text-orange-700 dark:text-orange-300"}">${tx.category}</span>
          </td>
          <td class="px-6 py-5 text-slate-500 dark:text-slate-400">${tx.date}</td>
          <td class="px-6 py-5 font-bold text-right ${isIncome ? "text-secondary" : "text-tertiary"}">
            ${isIncome ? "+" : "-"}$${Math.abs(tx.amount).toFixed(2)}
          </td>
          <td class="px-6 py-5 text-center">
            <button onclick="deleteTransaction(${tx.id})" class="text-slate-400 hover:text-red-600">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </td>
        `;
          tbody.appendChild(row);
        });
        renderPagination();
      }
      function renderPagination() {
        const container = document.getElementById("pagination");
        container.innerHTML = "";
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.className = `px-4 py-2 mx-1 rounded-xl text-sm font-medium transition-all ${i === currentPage ? "bg-primary text-white" : "bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600"}`;
          btn.onclick = () => {
            currentPage = i;
            renderTransactions();
          };
          container.appendChild(btn);
        }
      }
      function deleteTransaction(id) {
        if (confirm("Delete this transaction?")) {
          transactions = transactions.filter((t) => t.id !== id);
          saveData();
          filteredData = transactions;
          currentPage = 1;
          renderTransactions();
        }
      }
      function filterTransactions() {
        const searchTerm = document
          .getElementById("search-input")
          .value.toLowerCase()
          .trim();
        const categoryFilter = document.getElementById("category-filter").value;
        const fromDate = document.getElementById("from-date").value;
        const toDate = document.getElementById("to-date").value;
        const minAmount = parseFloat(
          document.getElementById("min-amount").value,
        );
        const maxAmount = parseFloat(
          document.getElementById("max-amount").value,
        );
        filteredData = transactions.filter((tx) => {
          const txDate = new Date(tx.date);
          const from = fromDate ? new Date(fromDate) : null;
          const to = toDate ? new Date(toDate) : null;
          const amount = Math.abs(tx.amount);
          const matchesSearch =
            !searchTerm ||
            tx.description.toLowerCase().includes(searchTerm) ||
            tx.category.toLowerCase().includes(searchTerm);
          const matchesCategory =
            !categoryFilter || tx.category === categoryFilter;
          const matchesFrom = !from || txDate >= from;
          const matchesTo = !to || txDate <= to;
          const matchesMin = isNaN(minAmount) || amount >= minAmount;
          const matchesMax = isNaN(maxAmount) || amount <= maxAmount;
          return (
            matchesSearch &&
            matchesCategory &&
            matchesFrom &&
            matchesTo &&
            matchesMin &&
            matchesMax
          );
        });
        currentPage = 1;
        renderTransactions();
      }
      function showQuickAddModal() {
        document.getElementById("quick-add-modal").classList.remove("hidden");
        document.getElementById("modal-date").valueAsDate = new Date();
        populateModalCategories();
      }
      function hideQuickAddModal() {
        document.getElementById("quick-add-modal").classList.add("hidden");
        document.getElementById("modal-form").reset();
      }
      document
        .getElementById("modal-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const desc = document.getElementById("modal-desc").value.trim();
          const amount = parseFloat(
            document.getElementById("modal-amount").value,
          );
          const date = document.getElementById("modal-date").value;
          const category = document.getElementById("modal-category").value;
          if (!desc || !amount || !date || !category)
            return alert("Please fill all fields");
          transactions.unshift({
            id: Date.now(),
            description: desc,
            amount,
            date,
            category,
          });
          saveData();
          filteredData = transactions;
          currentPage = 1;
          renderTransactions();
          hideQuickAddModal();
        });
      function toggleDarkMode() {
        const html = document.documentElement;
        html.classList.toggle("dark");
        localStorage.setItem(
          "fintrack_theme",
          html.classList.contains("dark") ? "dark" : "light",
        );
        document.getElementById("theme-icon").textContent =
          html.classList.contains("dark") ? "light_mode" : "dark_mode";
      }
      function logout() {
        if (confirm("Are you sure you want to logout?")) {
          localStorage.removeItem("fintrack_current_user");
          location.reload();
        }
      }
      // Initialize
      window.onload = function () {
        const savedUser = localStorage.getItem("fintrack_current_user");
        if (savedUser) {
          currentUser = savedUser;
          showMainApp();
        } else {
          window.location.href = "index.html";
        }
        const savedTheme = localStorage.getItem("fintrack_theme");
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
          document.getElementById("theme-icon").textContent = "light_mode";
        }
        // Live filters
        const filterIds = [
          "search-input",
          "category-filter",
          "from-date",
          "to-date",
          "min-amount",
          "max-amount",
        ];
        filterIds.forEach((id) => {
          const el = document.getElementById(id);
          el.addEventListener("input", filterTransactions);
          el.addEventListener("change", filterTransactions);
        });
      };
    </script>
  </body>
</html>
